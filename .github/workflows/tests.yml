name: CPU software checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fixtures:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install numerical fixture dependency only
        run: python -m pip install -r requirements-test.txt
      - name: Verify source manifest, syntax and input bundle
        run: python scripts/check_repository.py
      - name: Run handwritten CPU fixtures without neural execution
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python -m unittest discover -s tests -v
